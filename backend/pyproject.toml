[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-backend"
version = "0.1.0"
description = "Astra API foundation"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.2,<3",
  "alembic>=1.20,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.7,<3",
  "simpy>=4.1,<5",
  "sqlalchemy>=2.0.54,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"app.templates" = ["data/*.json"]

[tool.ruff.lint]
select = ["E9", "F"]
